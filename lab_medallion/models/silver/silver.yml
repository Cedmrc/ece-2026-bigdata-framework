models:
  - name: stg_users
    description: One row per user, typed and cleaned.
    columns:
      - name: user_id
        description: Unique identifier of the user.
        data_tests:
          - unique
          - not_null

      - name: username_normalized
        description: Username converted to lowercase without leading or trailing spaces.
        data_tests:
          - not_null

      - name: email
        data_tests:
          - unique
          - not_null

      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: ["F", "M"]

      - name: birthdate_is_valid
        description: Indicates whether the original birthdate is valid compared with the first order.
        data_tests:
          - not_null

      - name: state
        description: State or military region code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('states')
                field: code

  - name: stg_orders
    description: One row per order, typed and deduplicated.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id

      - name: quantity
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: ["bread", "brioche", "cookie", "croissant", "donut", "drink"]
